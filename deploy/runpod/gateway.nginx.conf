# Public gateway on :8080 -> Structsync at /, Scanner at /scanner/
pid /workspace/proxy/nginx.pid;
events { worker_connections 1024; }
http {
    access_log /workspace/proxy/logs/access.log;
    error_log  /workspace/proxy/logs/error.log;
    client_max_body_size 1024M;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 8080;
        absolute_redirect off;

        location = /scanner { return 301 /scanner/viewer/; }
        location = /scanner/ { return 301 /scanner/viewer/; }
        location /scanner/ {
            proxy_pass http://127.0.0.1:8765/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";        # so sub_filter can rewrite
            proxy_redirect ~^(https?://[^/]+)?/(.*)$ /scanner/$2;
            # viewer JS hardcodes /api/... ; point it at /scanner/api/...
            sub_filter_types application/javascript text/javascript;
            sub_filter "'/api/" "'/scanner/api/";
            sub_filter "`/api/" "`/scanner/api/";
            sub_filter_once off;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
    }
}
